<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b09"><title>Blind Path — Hide & Seek</title>
<style>
:root{--bg:#070b09;--panel:#101813;--panel2:#18231c;--border:#2b3a30;--text:#eef5ef;--muted:#9baa9f;--p1:#35d4b0;--p2:#ef6174}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050806;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;justify-content:center;padding:14px 10px 28px}.app{width:100%;max-width:760px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.logo{font-size:24px;font-weight:950;letter-spacing:2px}.logo span{color:var(--p1)}
.round{text-align:right;font-size:11px;color:var(--muted)}.round strong{color:var(--text);font-size:14px}
.card{background:#0d130f;border:1px solid var(--border);border-radius:22px;padding:12px;box-shadow:0 24px 70px #0008}
.status{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 10px}.msg{font-size:13px;color:var(--muted)}
.scores{display:flex;gap:7px}.score{padding:6px 9px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:800}.p1{color:var(--p1)}.p2{color:var(--p2)}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#0b120d}canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.badge{padding:7px 10px;border:1px solid #fff2;border-radius:11px;background:#040705b0;font-size:11px;color:#dce7df}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.controlBox{border:1px solid var(--border);border-radius:16px;background:#0d1510;padding:9px}.controlTitle{font-size:11px;font-weight:900;letter-spacing:.8px;margin-bottom:7px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:190px;margin:auto}button{border:1px solid #304036;background:#19251e;color:#eef5ef;border-radius:11px;min-height:42px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.94)}.blank{visibility:hidden}
.pad button{font-size:17px}.flash{width:100%;margin-top:7px;min-height:38px}.help{text-align:center;color:var(--muted);font-size:11px;margin:11px 2px 1px;line-height:1.5}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#020503d1;backdrop-filter:blur(8px);z-index:20}.overlay.show{display:flex}.modal{width:min(390px,100%);padding:26px 21px;border:1px solid var(--border);border-radius:22px;background:#111a14;text-align:center;box-shadow:0 30px 90px #0009}.modal h2{margin:0;font-size:25px}.stars{margin:8px 0 4px;color:#ffd166;font-size:31px}.details{color:var(--muted);font-size:13px;margin:0 0 17px;line-height:1.55}.primary{width:100%;min-height:48px;border:0;background:var(--p1);color:#06120d;font-size:14px;font-weight:950}
@media(max-width:560px){body{padding:8px 6px 22px}.logo{font-size:20px}.card{padding:8px;border-radius:18px}.controls{gap:7px}.controlBox{padding:7px}.controlTitle{font-size:10px}.pad button{min-height:38px}}
</style></head><body>
<main class="app"><header class="header"><div class="logo">BLIND <span>PATH</span></div><div class="round">HIDE &amp; SEEK<br><strong id="roundText">Round 1 · First to 3</strong></div></header>
<section class="card"><div class="status"><div class="msg" id="message">Memorize the forest…</div><div class="scores"><div class="score p1">P1 <span id="score1">0</span></div><div class="score p2">P2 <span id="score2">0</span></div></div></div>
<div class="stage"><canvas id="game"></canvas><div class="hud"><div class="badge" id="stateBadge">PREVIEW</div><div class="badge">🔦 Flash: <span id="flashHud">3 / 3</span></div></div></div>
<div class="controls">
<div class="controlBox"><div class="controlTitle p1">PLAYER 1 · WASD</div><div class="pad"><button class="blank"></button><button data-p="1" data-d="up">▲</button><button class="blank"></button><button data-p="1" data-d="left">◀</button><button data-p="1" data-d="down">▼</button><button data-p="1" data-d="right">▶</button></div><button class="flash p1" data-flash="1">⚡ Flash <span id="f1">3</span></button></div>
<div class="controlBox"><div class="controlTitle p2">PLAYER 2 · ARROWS</div><div class="pad"><button class="blank"></button><button data-p="2" data-d="up">▲</button><button class="blank"></button><button data-p="2" data-d="left">◀</button><button data-p="2" data-d="down">▼</button><button data-p="2" data-d="right">▶</button></div><button class="flash p2" data-flash="2">⚡ Flash <span id="f2">3</span></button></div>
</div><p class="help">Find the other player before they find you. The hidden grid controls movement; you only see a natural forest path.</p></section></main>
<div class="overlay" id="overlay"><div class="modal"><h2 id="resultTitle"></h2><div class="stars">★</div><p class="details" id="resultDetails"></p><button class="primary" id="nextBtn">Next Round</button></div></div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const msg=document.getElementById("message"),roundText=document.getElementById("roundText"),s1=document.getElementById("score1"),s2=document.getElementById("score2"),badge=document.getElementById("stateBadge"),fh=document.getElementById("flashHud"),f1=document.getElementById("f1"),f2=document.getElementById("f2"),overlay=document.getElementById("overlay"),title=document.getElementById("resultTitle"),details=document.getElementById("resultDetails"),next=document.getElementById("nextBtn");
const CFG={preview:3500,vision:2,flashVision:4,flashDuration:1300,flashes:3},WIN=3,MAX=5;
let round=1,scores={1:0,2:0},rows=15,cols=15,tile=20,grid=[],preview=true,finished=false,started=0,seed=Math.random()*1e5;
let players={1:{r:1,c:1,dir:"down",flashes:3,moves:0,flashUntil:0},2:{r:13,c:13,dir:"up",flashes:3,moves:0,flashUntil:0}};
function resize(){let q=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=q.width*d;canvas.height=q.height*d;ctx.setTransform(d,0,0,d,0,0);tile=q.width/cols;draw()}addEventListener("resize",resize);
function maze(){rows=cols=Math.min(25,15+2*Math.floor((round-1)/2));grid=Array.from({length:rows},()=>Array(cols).fill(1));let st=[[1,1]];grid[1][1]=0;while(st.length){let [r,c]=st[st.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),ok=0;for(let [dr,dc] of ds){let R=r+dr,C=c+dc;if(R>0&&R<rows-1&&C>0&&C<cols-1&&grid[R][C]){grid[r+dr/2][c+dc/2]=0;grid[R][C]=0;st.push([R,C]);ok=1;break}}if(!ok)st.pop()}}
function reset(){maze();players={1:{r:1,c:1,dir:"down",flashes:3,moves:0,flashUntil:0},2:{r:rows-2,c:cols-2,dir:"up",flashes:3,moves:0,flashUntil:0}};grid[1][1]=grid[rows-2][cols-2]=0;preview=true;finished=false;started=Date.now();ui();resize();msg.textContent="Memorize the forest paths…";badge.textContent="PREVIEW";setTimeout(()=>{if(finished)return;preview=false;started=Date.now();msg.textContent="Find the other player.";badge.textContent="HIDE & SEEK"},CFG.preview)}
function inside(r,c){return r>=0&&r<rows&&c>=0&&c<cols}function wall(r,c){return !inside(r,c)||grid[r][c]}
function move(id,dir){if(preview||finished)return;let p=players[id],d={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[dir];if(!d)return;p.dir=dir;let r=p.r+d[0],c=p.c+d[1];if(wall(r,c)){msg.textContent=`Player ${id}: blocked by the forest.`;return}p.r=r;p.c=c;p.moves++;if(p.r===players[id===1?2:1].r&&p.c===players[id===1?2:1].c)return win(id);draw()}
function flash(id){if(preview||finished||players[id].flashes<1)return;players[id].flashes--;players[id].flashUntil=Date.now()+CFG.flashDuration;msg.textContent=`Player ${id} used FLASH!`;ui()}
function win(id){finished=true;scores[id]++;ui();let t=(Date.now()-started)/1000;title.textContent=`Player ${id} Found the Opponent!`;details.textContent=`Round ${round} · ${t.toFixed(1)} seconds · Score ${scores[1]} — ${scores[2]}`;next.textContent=scores[id]>=WIN||round>=MAX?"Finish Match":"Next Round";overlay.classList.add("show")}
function ui(){s1.textContent=scores[1];s2.textContent=scores[2];roundText.textContent=`Round ${round} · First to ${WIN}`;f1.textContent=players[1].flashes;f2.textContent=players[2].flashes;fh.textContent=`${players[1].flashes} / ${players[2].flashes}`}
function advance(){overlay.classList.remove("show");if(scores[1]>=WIN||scores[2]>=WIN||round>=MAX){let w=scores[1]>scores[2]?1:2;title.textContent=scores[1]===scores[2]?"Match Draw":`🏆 Player ${w} Wins the Match!`;details.textContent=`Final score: ${scores[1]} — ${scores[2]}`;next.textContent="Play Again";next.onclick=()=>{scores={1:0,2:0};round=1;overlay.classList.remove("show");next.onclick=advance;reset()};overlay.classList.add("show");return}round++;next.onclick=advance;reset()}next.onclick=advance;
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>move(+b.dataset.p,b.dataset.d));document.querySelectorAll("[data-flash]").forEach(b=>b.onclick=()=>flash(+b.dataset.flash));
document.onkeydown=e=>{let a={w:"up",a:"left",s:"down",d:"right"},b={ArrowUp:"up",ArrowLeft:"left",ArrowDown:"down",ArrowRight:"right"};if(a[e.key]){e.preventDefault();move(1,a[e.key])}if(b[e.key]){e.preventDefault();move(2,b[e.key])}if(e.key.toLowerCase()=="q"){e.preventDefault();flash(1)}if(e.key=="/"){e.preventDefault();flash(2)}};

function noise(r,c){let n=Math.sin((r*127.1+c*311.7+seed)*.017)*43758.5;return n-Math.floor(n)}
function pt(r,c){return{x:c*tile+tile/2,y:r*tile+tile/2}}
function ground(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle="#0b160e";ctx.fillRect(0,0,w,h);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let x=c*tile,y=r*tile;if(!grid[r][c]){ctx.fillStyle=noise(r,c)>.5?"#29402a":"#233923";ctx.fillRect(x,y,tile+1,tile+1)}else{ctx.fillStyle=noise(r,c)>.5?"#102114":"#0c1a11";ctx.fillRect(x,y,tile+1,tile+1)}}}
function paths(){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!grid[r][c]){let p=pt(r,c),rad=tile*.31;ctx.fillStyle="#8e704322";ctx.beginPath();ctx.arc(p.x,p.y,rad,0,7);ctx.fill();ctx.strokeStyle="#cab06f2b";ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,rad*.72,0,7);ctx.stroke()}}
function tree(r,c){let p=pt(r,c),s=tile*.42;ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(p.x,p.y+s*.8,s*.7,s*.2,0,0,7);ctx.fill();ctx.fillStyle="#51351f";ctx.fillRect(p.x-s*.1,p.y,s*.2,s*.65);ctx.fillStyle="#17351e";ctx.beginPath();ctx.arc(p.x,p.y-s*.05,s*.53,0,7);ctx.fill();ctx.fillStyle="#285027";ctx.beginPath();ctx.arc(p.x-s*.24,p.y-s*.22,s*.32,0,7);ctx.fill();ctx.beginPath();ctx.arc(p.x+s*.24,p.y-s*.25,s*.3,0,7);ctx.fill()}
function rock(r,c){let p=pt(r,c),s=tile*.24;ctx.fillStyle="#4b574d";ctx.beginPath();ctx.ellipse(p.x,p.y,s*1.2,s*.7,-.2,0,7);ctx.fill();ctx.fillStyle="#697367";ctx.beginPath();ctx.ellipse(p.x-s*.2,p.y-s*.12,s*.6,s*.27,-.2,0,7);ctx.fill()}
function decor(){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(grid[r][c]&&noise(r+10,c+20)>.18){noise(r,c)>.5?tree(r,c):rock(r,c)}}
function character(p,id){let q=pt(p.r,p.c),s=Math.max(15,tile*.34);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(({up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2}[p.dir]));ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(0,s*.58,s*.5,s*.17,0,0,7);ctx.fill();ctx.strokeStyle="#121714";ctx.lineWidth=Math.max(2,tile*.075);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-s*.16,s*.22);ctx.lineTo(-s*.22,s*.62);ctx.moveTo(s*.16,s*.22);ctx.lineTo(s*.22,s*.62);ctx.stroke();ctx.fillStyle="#090b0a";ctx.beginPath();ctx.ellipse(-s*.24,s*.66,s*.14,s*.07,0,0,7);ctx.ellipse(s*.24,s*.66,s*.14,s*.07,0,0,7);ctx.fill();ctx.fillStyle=id==1?"#197f70":"#a83f52";ctx.beginPath();ctx.roundRect(-s*.39,-s*.07,s*.78,s*.56,s*.12);ctx.fill();ctx.strokeStyle="#fff8";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-s*.02);ctx.lineTo(0,s*.42);ctx.stroke();ctx.strokeStyle=id==1?"#126458":"#77303d";ctx.lineWidth=Math.max(2,tile*.075);ctx.beginPath();ctx.moveTo(-s*.31,0);ctx.lineTo(-s*.5,s*.25);ctx.moveTo(s*.31,0);ctx.lineTo(s*.48,s*.17);ctx.stroke();ctx.fillStyle="#d0d5d4";ctx.roundRect(s*.41,s*.08,s*.19,s*.08,s*.03);ctx.fill();ctx.fillStyle="#b97859";ctx.fillRect(-s*.1,-s*.22,s*.2,s*.12);ctx.fillStyle="#ca8967";ctx.beginPath();ctx.ellipse(0,-s*.37,s*.23,s*.26,0,0,7);ctx.fill();ctx.fillStyle="#252824";ctx.beginPath();ctx.arc(0,-s*.48,s*.235,Math.PI,7);ctx.fill();ctx.fillStyle=id==1?"#0f5d52":"#762c3a";ctx.beginPath();ctx.roundRect(-s*.47,-s*.01,s*.13,s*.38,s*.04);ctx.fill();ctx.restore()}
function light(p,id){let q=pt(p.r,p.c),a={up:-Math.PI/2,right:0,down:Math.PI/2,left:Math.PI}[p.dir],len=tile*3.4;ctx.save();ctx.globalAlpha=.13;let g=ctx.createRadialGradient(q.x,q.y,0,q.x+Math.cos(a)*len,q.y+Math.sin(a)*len,len);g.addColorStop(0,id==1?"#8ffff0":"#ff9aa8");g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.arc(q.x,q.y,len,a-.48,a+.48);ctx.closePath();ctx.fill();ctx.restore()}
function darkness(){ctx.save();ctx.fillStyle="#000000d4";ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);for(let id of [1,2]){let p=players[id],rad=(Date.now()<p.flashUntil?CFG.flashVision:CFG.vision)*tile,q=pt(p.r,p.c),g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rad*1.25);g.addColorStop(0,"#0000");g.addColorStop(.55,"#0002");g.addColorStop(1,"#000");ctx.globalCompositeOperation="destination-out";ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rad*1.25,0,7);ctx.fill()}ctx.restore()}
function draw(){if(!canvas.clientWidth)return;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ground();paths();decor();light(players[1],1);light(players[2],2);if(preview){character(players[1],1);character(players[2],2);return}darkness();for(let id of [1,2]){let other=id==1?2:1,rad=Date.now()<players[other].flashUntil?CFG.flashVision:CFG.vision;if(Math.abs(players[id].r-players[other].r)+Math.abs(players[id].c-players[other].c)<=rad)character(players[id],id);let p=players[id],q=pt(p.r,p.c),g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,tile*.7);g.addColorStop(0,id==1?"#35d4b055":"#ef617455");g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,tile*.7,0,7);ctx.fill()}}
setInterval(()=>{draw();ui()},120);reset();
</script></body></html>
