<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blind Path 3D</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07100a;
  font-family:Arial,sans-serif;
  color:#fff;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ---------- Start ---------- */

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at center,#18351ecc,#020503f7);
}

.card{
  width:min(430px,92vw);
  padding:28px 22px;
  border:1px solid #56745b;
  border-radius:22px;
  background:#0d160fee;
  box-shadow:0 25px 80px #000d;
  text-align:center;
}

.card h1{
  margin:0 0 8px;
  font-size:34px;
}

.card p{
  color:#b9c8bc;
  line-height:1.5;
}

#begin{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#69df8e;
  color:#061009;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

/* ---------- HUD ---------- */

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:20;
  display:none;
  pointer-events:none;
}

.hudbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.hudbox{
  background:#071009dc;
  border:1px solid #48604c;
  border-radius:13px;
  padding:8px 11px;
  box-shadow:0 6px 22px #0007;
  backdrop-filter:blur(7px);
}

.title{
  font-weight:900;
  letter-spacing:.5px;
}

#status{
  margin-top:2px;
  font-size:12px;
  color:#d9e6db;
}

#distance{
  font-weight:900;
}

/* ---------- Flash ---------- */

#flash{
  position:fixed;
  right:18px;
  bottom:22px;
  z-index:25;
  display:none;
  width:68px;
  height:68px;
  padding:0;
  border:3px solid #fff;
  border-radius:50%;
  background:#f3d15b;
  color:#171207;
  font-size:27px;
  box-shadow:
    0 0 0 2px #171207,
    0 8px 28px #0009,
    0 0 35px #f3d15b66;
  cursor:pointer;
}

#flash:active{
  transform:scale(.93);
}

/* ---------- Mobile controls ---------- */

#controls{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:25;
  display:none;
  width:160px;
  height:160px;
  user-select:none;
}

.ctrl{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:15px;
  border:1px solid #6c836f;
  background:#0a140ddd;
  color:#eaf3eb;
  font-size:22px;
  font-weight:900;
  box-shadow:0 7px 18px #0008;
}

.ctrl:active{
  background:#315c3b;
  transform:scale(.94);
}

#up{left:54px;top:0}
#left{left:0;top:54px}
#right{right:0;top:54px}
#down{left:54px;bottom:0}

#hint{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  z-index:15;
  display:block;
  padding:8px 12px;
  border-radius:10px;
  background:#071009c9;
  color:#dce7de;
  font-size:12px;
  pointer-events:none;
  white-space:nowrap;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  #controls{display:block}
  #hint{display:none}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="start">
  <div class="card">
    <h1>🌲 Blind Path</h1>
    <p>Find your way through the forest maze.</p>
    <p>Use <b>WASD</b>, arrow keys, or the controls on mobile.</p>
    <button id="begin" type="button">Enter the Forest</button>
  </div>
</div>

<div id="hud">
  <div class="hudbar">
    <div class="hudbox">
      <div class="title">🌲 BLIND PATH</div>
      <div id="status">Find the exit</div>
    </div>
    <div class="hudbox" id="distance">0 m</div>
  </div>
</div>

<button id="flash" type="button">🔦</button>

<div id="controls">
  <button class="ctrl" id="up" type="button">▲</button>
  <button class="ctrl" id="left" type="button">◀</button>
  <button class="ctrl" id="right" type="button">▶</button>
  <button class="ctrl" id="down" type="button">▼</button>
</div>

<div id="hint">WASD / Arrow Keys · 🔦 Flash reveals the path for 5 seconds</div>

<!-- Keep your local Three.js file -->
<script src="js/three.min.js"></script>

<script>
(function(){
"use strict";

/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const start = $("start");
const begin = $("begin");
const game = $("game");
const hud = $("hud");
const status = $("status");
const distanceEl = $("distance");
const flashBtn = $("flash");


/* =========================================================
   GAME
========================================================= */

let scene;
let camera;
let renderer;
let clock;
let player;
let flashLight = null;
let started = false;

const keys = {};

const CELL = 2.15;
const COLS = 31;
const ROWS = 45;

let maze = [];
let startCell;
let goalCell;
let goalObject;

let seed = 734921;

function rnd(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

function cx(c){
  return (c - (COLS - 1) / 2) * CELL;
}

function cz(r){
  return (r - (ROWS - 1) / 2) * CELL;
}


/* =========================================================
   START
========================================================= */

begin.addEventListener("click",function(e){

  e.preventDefault();

  if(started) return;

  if(typeof THREE === "undefined"){
    status.textContent = "3D engine failed to load";
    return;
  }

  started = true;

  start.classList.add("hidden");
  hud.style.display = "block";
  flashBtn.style.display = "block";

  status.textContent = "Building forest…";

  init();

});


/* =========================================================
   INIT
========================================================= */

function init(){

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x07100a);

  scene.fog =
    new THREE.FogExp2(
      0x07100a,
      0.018
    );


  /* -------------------------------------------------------
     TOP-DOWN 3/4 CAMERA

     Orthographic keeps the reference-game feeling.
     The slight Z offset keeps objects visibly 3D.
  ------------------------------------------------------- */

  const aspect =
    innerWidth / innerHeight;

  const view = 23;

  camera =
    new THREE.OrthographicCamera(
      -view * aspect,
       view * aspect,
       view,
      -view,
      0.1,
      300
    );

  camera.position.set(
    0,
    38,
    13
  );

  camera.lookAt(0,0,0);


  /* -------------------------------------------------------
     RENDERER
  ------------------------------------------------------- */

  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  game.appendChild(
    renderer.domElement
  );


  clock = new THREE.Clock();


  /* -------------------------------------------------------
     LIGHTING
  ------------------------------------------------------- */

  scene.add(
    new THREE.HemisphereLight(
      0x6f8873,
      0x101810,
      0.55
    )
  );


  const moon =
    new THREE.DirectionalLight(
      0x9eafd0,
      0.48
    );

  moon.position.set(
    -25,
    45,
    18
  );

  moon.castShadow = true;

  moon.shadow.mapSize.width = 2048;
  moon.shadow.mapSize.height = 2048;

  moon.shadow.camera.left = -80;
  moon.shadow.camera.right = 80;
  moon.shadow.camera.top = 100;
  moon.shadow.camera.bottom = -100;

  scene.add(moon);


  createMaze();

  buildWorld();

  createPlayer();

  updateCamera(1);

  status.textContent =
    "Find the exit";

  requestAnimationFrame(loop);
}


/* =========================================================
   MAZE
   Starts at bottom CENTER and exits at top CENTER.

   Because this is a perfect maze, every open corridor
   belongs to the same connected maze.
========================================================= */

function createMaze(){

  maze =
    Array.from(
      {length:ROWS},
      () => Array(COLS).fill(1)
    );


  const startR = ROWS - 2;
  const startC = Math.floor(COLS / 2);

  maze[startR][startC] = 0;


  const stack = [{
    r:startR,
    c:startC
  }];


  const directions = [
    [-2,0],
    [2,0],
    [0,-2],
    [0,2]
  ];


  while(stack.length){

    const current =
      stack[stack.length - 1];

    const choices = [];


    for(const d of directions){

      const nr =
        current.r + d[0];

      const nc =
        current.c + d[1];


      if(
        nr > 0 &&
        nr < ROWS - 1 &&
        nc > 0 &&
        nc < COLS - 1 &&
        maze[nr][nc] === 1
      ){

        choices.push({
          nr:nr,
          nc:nc,
          wr:current.r + d[0]/2,
          wc:current.c + d[1]/2
        });

      }

    }


    if(!choices.length){

      stack.pop();
      continue;

    }


    const p =
      choices[
        Math.floor(
          rnd() * choices.length
        )
      ];


    maze[p.wr][p.wc] = 0;
    maze[p.nr][p.nc] = 0;


    stack.push({
      r:p.nr,
      c:p.nc
    });

  }


  startCell = {
    r:ROWS - 2,
    c:startC
  };


  goalCell = {
    r:1,
    c:Math.floor(COLS / 2)
  };


  /* Open a clean entrance and exit */

  maze[ROWS-1][startC] = 0;
  maze[0][goalCell.c] = 0;

}


/* =========================================================
   WORLD GROUND
========================================================= */

function buildGround(){

  const width =
    COLS * CELL + 12;

  const depth =
    ROWS * CELL + 12;


  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width,
        depth
      ),
      new THREE.MeshStandardMaterial({
        color:0x304a31,
        roughness:1
      })
    );

  ground.rotation.x =
    -Math.PI / 2;

  ground.position.y =
    -0.18;

  ground.receiveShadow = true;

  scene.add(ground);


  /* Large darker outer forest floor */

  const outer =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width + 30,
        depth + 30
      ),
      new THREE.MeshStandardMaterial({
        color:0x182a1b,
        roughness:1
      })
    );

  outer.rotation.x =
    -Math.PI / 2;

  outer.position.y =
    -0.25;

  outer.receiveShadow = true;

  scene.add(outer);


  /* Irregular floor patches */

  const patchColors = [
    0x385537,
    0x2d492f,
    0x3d5939,
    0x28432d
  ];


  for(let i=0;i<150;i++){

    const patch =
      new THREE.Mesh(
        new THREE.CircleGeometry(
          0.5 + rnd()*1.8,
          9
        ),
        new THREE.MeshStandardMaterial({
          color:
            patchColors[
              Math.floor(
                rnd()*patchColors.length
              )
            ],
          roughness:1
        })
      );

    patch.rotation.x =
      -Math.PI/2;

    patch.position.set(
      (rnd()-0.5)*COLS*CELL,
      -0.02,
      (rnd()-0.5)*ROWS*CELL
    );

    patch.scale.x =
      0.7 + rnd()*1.8;

    patch.scale.y =
      0.7 + rnd()*1.2;

    scene.add(patch);

  }

}


/* =========================================================
   NATURAL PATH

   No visible square grid.
   Every open maze cell simply becomes part of the
   continuous forest floor.
========================================================= */

function buildPaths(){

  const pathMat =
    new THREE.MeshStandardMaterial({
      color:0x344a36,
      roughness:1
    });

  const dirtMat =
    new THREE.MeshStandardMaterial({
      color:0x463a2d,
      roughness:1
    });


  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      if(maze[r][c] !== 0)
        continue;


      const x = cx(c);
      const z = cz(r);


      /* Full corridor floor */

      const tile =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            CELL + 0.12,
            CELL + 0.12
          ),
          pathMat
        );

      tile.rotation.x =
        -Math.PI/2;

      tile.position.set(
        x,
        0.005,
        z
      );

      tile.receiveShadow = true;

      scene.add(tile);


      /* Natural dirt strip */

      const dirt =
        new THREE.Mesh(
          new THREE.CircleGeometry(
            0.62 + rnd()*0.12,
            10
          ),
          dirtMat
        );

      dirt.rotation.x =
        -Math.PI/2;

      dirt.position.set(
        x + (rnd()-0.5)*0.25,
        0.018,
        z + (rnd()-0.5)*0.25
      );

      dirt.scale.set(
        1.35,
        1.7,
        1
      );

      dirt.receiveShadow = true;

      scene.add(dirt);

    }

  }

}


/* =========================================================
   TREES

   Trees are placed on maze-wall cells.
   Their trunks and foliage form the visible maze walls.
========================================================= */

function createTree(x,z,s){

  const g =
    new THREE.Group();

  g.position.set(
    x,
    0,
    z
  );

  g.scale.setScalar(s);


  /* Trunk */

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.18,
        0.31,
        2.8,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x513824,
        roughness:1
      })
    );

  trunk.position.y =
    1.4;

  trunk.castShadow = true;

  g.add(trunk);


  /* Branches */

  for(let i=0;i<3;i++){

    const branch =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.055,
          0.11,
          1.15,
          7
        ),
        new THREE.MeshStandardMaterial({
          color:0x432f21,
          roughness:1
        })
      );

    branch.position.y =
      1.5 + i*0.48;

    branch.rotation.z =
      i%2 ? 0.72 : -0.72;

    branch.rotation.y =
      i*1.9;

    branch.castShadow = true;

    g.add(branch);

  }


  /* Layered rounded foliage */

  const colors = [
    0x16431f,
    0x1c5025,
    0x24622d,
    0x2b6b32
  ];


  for(let i=0;i<4;i++){

    const crown =
      new THREE.Mesh(
        new THREE.IcosahedronGeometry(
          0.98 - i*0.10,
          1
        ),
        new THREE.MeshStandardMaterial({
          color:colors[i],
          roughness:.95
        })
      );

    crown.position.y =
      2.55 + i*0.58;

    crown.scale.y =
      1.12;

    crown.castShadow = true;

    g.add(crown);

  }


  scene.add(g);

}


/* =========================================================
   FOREST WALLS
========================================================= */

function buildForestWalls(){

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      if(maze[r][c] !== 1)
        continue;


      /*
       * Most wall cells receive a tree.
       * A few receive two smaller trees so the walls
       * look organic rather than like a tiled hedge.
       */

      const x = cx(c);
      const z = cz(r);


      if(rnd() < 0.78){

        createTree(
          x + (rnd()-0.5)*0.38,
          z + (rnd()-0.5)*0.38,
          0.82 + rnd()*0.50
        );

      }
      else{

        createTree(
          x - 0.35 + rnd()*0.15,
          z + (rnd()-0.5)*0.3,
          0.62 + rnd()*0.30
        );

        createTree(
          x + 0.35 - rnd()*0.15,
          z + (rnd()-0.5)*0.3,
          0.62 + rnd()*0.30
        );

      }

    }

  }


  /* Outer forest border */

  for(let i=0;i<120;i++){

    const edge =
      Math.floor(rnd()*4);

    let x,z;


    if(edge===0){

      x =
        -COLS*CELL/2 -
        2 +
        rnd()*6;

      z =
        (rnd()-0.5) *
        ROWS*CELL;

    }
    else if(edge===1){

      x =
        COLS*CELL/2 +
        2 -
        rnd()*6;

      z =
        (rnd()-0.5) *
        ROWS*CELL;

    }
    else if(edge===2){

      x =
        (rnd()-0.5) *
        COLS*CELL;

      z =
        -ROWS*CELL/2 -
        2 +
        rnd()*6;

    }
    else{

      x =
        (rnd()-0.5) *
        COLS*CELL;

      z =
        ROWS*CELL/2 +
        2 -
        rnd()*6;

    }


    createTree(
      x,
      z,
      0.72 + rnd()*0.72
    );

  }

}


/* =========================================================
   ROCK
========================================================= */

function createRock(x,z,s){

  const rock =
    new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        0.42,
        1
      ),
      new THREE.MeshStandardMaterial({
        color:0x667067,
        roughness:1
      })
    );

  rock.position.set(
    x,
    0.28*s,
    z
  );

  rock.scale.set(
    1.25*s,
    0.65*s,
    s
  );

  rock.rotation.set(
    rnd(),
    rnd(),
    rnd()
  );

  rock.castShadow = true;
  rock.receiveShadow = true;

  scene.add(rock);

}


/* =========================================================
   BUSH
========================================================= */

function createBush(x,z,s){

  const group =
    new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );


  const mat =
    new THREE.MeshStandardMaterial({
      color:0x2f6935,
      roughness:1
    });


  for(let i=0;i<5;i++){

    const leaf =
      new THREE.Mesh(
        new THREE.IcosahedronGeometry(
          (.30 + rnd()*.18)*s,
          1
        ),
        mat
      );

    leaf.position.set(
      (rnd()-0.5)*.8*s,
      .30 + rnd()*.45*s,
      (rnd()-0.5)*.8*s
    );

    leaf.scale.y =
      .75 + rnd()*.35;

    leaf.castShadow = true;

    group.add(leaf);

  }


  scene.add(group);

}


/* =========================================================
   LOG
========================================================= */

function createLog(x,z){

  const log =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .16,
        .23,
        1.8,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x4a3020,
        roughness:1
      })
    );

  log.position.set(
    x,
    .18,
    z
  );

  log.rotation.z =
    Math.PI/2;

  log.rotation.y =
    rnd()*Math.PI;

  log.castShadow = true;

  scene.add(log);

}


/* =========================================================
   DECORATIONS

   Only place these on open cells, never on maze walls.
========================================================= */

function buildDecorations(){

  for(let i=0;i<130;i++){

    const r =
      1 +
      Math.floor(
        rnd()*(ROWS-2)
      );

    const c =
      1 +
      Math.floor(
        rnd()*(COLS-2)
      );


    if(maze[r][c] !== 0)
      continue;


    const x =
      cx(c) +
      (rnd()-0.5)*1.25;

    const z =
      cz(r) +
      (rnd()-0.5)*1.25;


    const type = rnd();


    if(type < .42){

      createBush(
        x,
        z,
        .55 + rnd()*.65
      );

    }
    else if(type < .75){

      createRock(
        x,
        z,
        .45 + rnd()*.60
      );

    }
    else{

      createLog(
        x,
        z
      );

    }

  }

}


/* =========================================================
   GOAL
========================================================= */

function createGoal(){

  goalObject =
    new THREE.Group();


  goalObject.position.set(
    cx(goalCell.c),
    0,
    cz(goalCell.r)
  );


  /* Stone base */

  const base =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .82,
        .82,
        .12,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0x82694b,
        roughness:1
      })
    );

  base.position.y =
    .08;

  base.receiveShadow = true;

  goalObject.add(base);


  /* Exit marker */

  const beacon =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .18,
        .26,
        1.4,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0xf0d77b,
        emissive:0x8a6817,
        emissiveIntensity:1.5
      })
    );

  beacon.position.y =
    .78;

  beacon.castShadow = true;

  goalObject.add(beacon);


  const light =
    new THREE.PointLight(
      0xffd76a,
      4,
      9
    );

  light.position.y =
    1.5;

  goalObject.add(light);


  scene.add(goalObject);

}


/* =========================================================
   WORLD
========================================================= */

function buildWorld(){

  buildGround();

  buildPaths();

  buildForestWalls();

  buildDecorations();

  createGoal();

}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

  player =
    new THREE.Group();


  player.position.set(
    cx(startCell.c),
    0,
    cz(startCell.r)
  );


  const skin =
    new THREE.MeshStandardMaterial({
      color:0xc58f6c,
      roughness:.8
    });

  const shirt =
    new THREE.MeshStandardMaterial({
      color:0x3e8056,
      roughness:.8
    });

  const pants =
    new THREE.MeshStandardMaterial({
      color:0x26323a,
      roughness:.9
    });

  const hair =
    new THREE.MeshStandardMaterial({
      color:0x211914,
      roughness:1
    });


  /* Body */

  const body =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .28,
        .62,
        6,
        10
      ),
      shirt
    );

  body.position.y =
    1.05;

  body.castShadow = true;

  player.add(body);


  /* Head */

  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .24,
        16,
        12
      ),
      skin
    );

  head.position.y =
    1.82;

  head.castShadow = true;

  player.add(head);


  /* Hair */

  const hairMesh =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .255,
        14,
        8
      ),
      hair
    );

  hairMesh.position.y =
    1.94;

  hairMesh.scale.y =
    .55;

  hairMesh.castShadow = true;

  player.add(hairMesh);


  /* Arms */

  for(const side of [-1,1]){

    const arm =
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .075,
          .48,
          5,
          8
        ),
        shirt
      );

    arm.position.set(
      side*.36,
      1.07,
      0
    );

    arm.rotation.z =
      side*.16;

    arm.castShadow = true;

    player.add(arm);

  }


  /* Legs */

  for(const side of [-1,1]){

    const leg =
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .09,
          .50,
          5,
          8
        ),
        pants
      );

    leg.position.set(
      side*.12,
      .45,
      0
    );

    leg.castShadow = true;

    player.add(leg);

  }


  /* Small visible marker */

  const marker =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .055,
        8,
        8
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd75e
      })
    );

  marker.position.y =
    2.2;

  player.add(marker);


  scene.add(player);

}


/* =========================================================
   COLLISION
========================================================= */

function openCell(x,z){

  const margin = .38;

  const samples = [
    [-margin,-margin],
    [ margin,-margin],
    [-margin, margin],
    [ margin, margin]
  ];


  for(const [sx,sz] of samples){

    const c =
      Math.round(
        (x+sx)/CELL +
        (COLS-1)/2
      );

    const r =
      Math.round(
        (z+sz)/CELL +
        (ROWS-1)/2
      );


    if(
      r < 0 ||
      r >= ROWS ||
      c < 0 ||
      c >= COLS
    ){

      return false;

    }


    if(maze[r][c] !== 0){

      return false;

    }

  }


  return true;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

  if(!player)
    return;


  let x =
    (keys.d || keys.arrowright ? 1 : 0) -
    (keys.a || keys.arrowleft ? 1 : 0);

  let z =
    (keys.s || keys.arrowdown ? 1 : 0) -
    (keys.w || keys.arrowup ? 1 : 0);


  if(!x && !z)
    return;


  const length =
    Math.hypot(x,z);


  x /= length;
  z /= length;


  const speed = 4.5;


  const nx =
    player.position.x +
    x*speed*dt;

  const nz =
    player.position.z +
    z*speed*dt;


  /* Wall collision */

  if(
    openCell(
      nx,
      player.position.z
    )
  ){

    player.position.x = nx;

  }


  if(
    openCell(
      player.position.x,
      nz
    )
  ){

    player.position.z = nz;

  }


  /* Face movement */

  const target =
    Math.atan2(x,z);

  let diff =
    target -
    player.rotation.y;


  while(diff > Math.PI)
    diff -= Math.PI*2;

  while(diff < -Math.PI)
    diff += Math.PI*2;


  player.rotation.y +=
    diff *
    Math.min(
      1,
      dt*10
    );


  checkGoal();

}


/* =========================================================
   GOAL CHECK
========================================================= */

function checkGoal(){

  if(!player || !goalObject)
    return;


  const d =
    Math.hypot(
      player.position.x -
      goalObject.position.x,

      player.position.z -
      goalObject.position.z
    );


  distanceEl.textContent =
    Math.round(d/2) + " m";


  if(d < 1.2){

    status.textContent =
      "🎉 You found the exit!";

  }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  if(!player)
    return;


  const smooth =
    Math.min(
      1,
      dt*5
    );


  const targetX =
    player.position.x;

  const targetZ =
    player.position.z;


  camera.position.x +=
    (
      targetX -
      camera.position.x
    ) * smooth;


  camera.position.y +=
    (
      38 -
      camera.position.y
    ) * smooth;


  camera.position.z +=
    (
      targetZ + 13 -
      camera.position.z
    ) * smooth;


  camera.lookAt(
    targetX,
    0,
    targetZ
  );

}


/* =========================================================
   FLASH
========================================================= */

function flash(){

  if(!player)
    return;


  if(flashLight)
    scene.remove(flashLight);


  flashLight =
    new THREE.PointLight(
      0xfff2c2,
      42,
      20,
      2
    );


  flashLight.position.set(
    player.position.x,
    3,
    player.position.z
  );


  scene.add(
    flashLight
  );


  setTimeout(
    function(){

      if(flashLight){

        scene.remove(
          flashLight
        );

        flashLight = null;

      }

    },
    5000
  );

}


flashBtn.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    flash();

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    const key =
      e.key.toLowerCase();

    keys[key] = true;


    if([
      "arrowup",
      "arrowdown",
      "arrowleft",
      "arrowright",
      " "
    ].includes(key)){

      e.preventDefault();

    }

  }
);


window.addEventListener(
  "keyup",
  function(e){

    keys[
      e.key.toLowerCase()
    ] = false;

  }
);


/* =========================================================
   MOBILE BUTTONS
========================================================= */

function bindControl(id,key){

  const button =
    $(id);


  function down(e){

    e.preventDefault();

    keys[key] = true;

  }


  function up(e){

    e.preventDefault();

    keys[key] = false;

  }


  button.addEventListener(
    "pointerdown",
    down
  );

  button.addEventListener(
    "pointerup",
    up
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );

}


bindControl("up","arrowup");
bindControl("down","arrowdown");
bindControl("left","arrowleft");
bindControl("right","arrowright");


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  function(){

    if(!camera || !renderer)
      return;


    const aspect =
      innerWidth / innerHeight;

    const view = 23;


    camera.left =
      -view*aspect;

    camera.right =
      view*aspect;

    camera.top =
      view;

    camera.bottom =
      -view;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

  requestAnimationFrame(loop);


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  updatePlayer(dt);

  updateCamera(dt);


  if(
    flashLight &&
    player
  ){

    flashLight.position.set(
      player.position.x,
      3,
      player.position.z
    );

  }


  renderer.render(
    scene,
    camera
  );

}


})();
</script>
