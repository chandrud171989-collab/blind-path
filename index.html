<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blind Path 3D</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07100a;
  font-family:Arial,sans-serif;
  color:#fff;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ---------- Start ---------- */

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at center,#18351ecc,#020503f7);
}

.card{
  width:min(430px,92vw);
  padding:28px 22px;
  border:1px solid #56745b;
  border-radius:22px;
  background:#0d160fee;
  box-shadow:0 25px 80px #000d;
  text-align:center;
}

.card h1{
  margin:0 0 8px;
  font-size:34px;
}

.card p{
  color:#b9c8bc;
  line-height:1.5;
}

#begin{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#69df8e;
  color:#061009;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

/* ---------- HUD ---------- */

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:20;
  display:none;
  pointer-events:none;
}

.hudbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.hudbox{
  background:#071009dc;
  border:1px solid #48604c;
  border-radius:13px;
  padding:8px 11px;
  box-shadow:0 6px 22px #0007;
  backdrop-filter:blur(7px);
}

.title{
  font-weight:900;
  letter-spacing:.5px;
}

#status{
  margin-top:2px;
  font-size:12px;
  color:#d9e6db;
}

#distance{
  font-weight:900;
}

#goldClue{
  position:fixed;
  left:50%;
  top:86px;
  transform:translateX(-50%);
  z-index:21;
  display:none;
  padding:8px 14px;
  border-radius:12px;
  background:#071009dd;
  border:1px solid #806a32;
  color:#ffe58a;
  font-size:15px;
  font-weight:900;
  box-shadow:0 6px 22px #0008;
  pointer-events:none;
  white-space:nowrap;
}
#goldArrow{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin-left:8px;
  font-size:32px;
  line-height:1;
  font-weight:900;
  color:#ffd447;
  text-shadow:0 0 10px #ffd447aa,0 2px 4px #000;
  transform-origin:50% 50%;
}


/* ---------- Mobile controls ---------- */

#controls{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:25;
  display:none;
  width:160px;
  height:160px;
  user-select:none;
}

.ctrl{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:15px;
  border:1px solid #6c836f;
  background:#0a140ddd;
  color:#eaf3eb;
  font-size:22px;
  font-weight:900;
  box-shadow:0 7px 18px #0008;
}

.ctrl:active{
  background:#315c3b;
  transform:scale(.94);
}

#up{left:54px;top:0}
#left{left:0;top:54px}
#right{right:0;top:54px}
#down{left:54px;bottom:0}

#hint{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  z-index:15;
  display:block;
  padding:8px 12px;
  border-radius:10px;
  background:#071009c9;
  color:#dce7de;
  font-size:12px;
  pointer-events:none;
  white-space:nowrap;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  #controls{display:block}
  #hint{display:none}
}

#shoot{
  position:fixed;
  right:102px;
  bottom:28px;
  z-index:25;
  display:none;
  width:82px;
  height:82px;
  padding:0;
  border:3px solid #fff;
  border-radius:50%;
  background:#c94a4a;
  color:#fff;
  font-size:28px;
  box-shadow:0 0 0 2px #171207,0 8px 28px #0009,0 0 35px #c94a4a66;
  cursor:pointer;
  font-weight:900;
}
#shoot:active{transform:scale(.93)}
#shoot.ready{animation:shootPulse 1s infinite}
@keyframes shootPulse{50%{box-shadow:0 0 0 2px #171207,0 8px 28px #0009,0 0 45px #ff5757}}
.modeBtn{border:1px solid #46534a;background:#182019;color:#cfd9d0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}
.modeBtn.active{background:#234238;border-color:#2dd4bf;color:#fff}
@media(max-width:700px){#shoot{right:18px;bottom:104px}}

</style>
</head>

<body>

<div id="game"></div>

<div id="start">
  <div class="card">
    <h1>🌲 Blind Path</h1>
    <p>Hide & Seek in a dark 3D forest.</p>
    <div id="modeRow" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0">
      <button id="computerMode" type="button" class="modeBtn active">🤖 Computer</button>
      <button id="createMode" type="button" class="modeBtn">👥 Create Game</button>
      <button id="joinMode" type="button" class="modeBtn">🔗 Join Game</button>
    </div>
    <div id="roomPanel" style="display:none;margin:10px 0">
      <div id="createPinBox" style="display:none">
        <div style="font-size:12px;color:#b9c8bc;margin-bottom:5px">Your Game PIN</div>
        <div id="roomPinDisplay" style="font-size:30px;font-weight:900;letter-spacing:8px;padding:10px 16px;border-radius:12px;border:1px solid #44504a;background:#111712;color:#fff;display:inline-block;min-width:180px">------</div>
        <div style="font-size:12px;color:#b9c8bc;margin-top:6px">Share this PIN with the other player</div>
      </div>
      <div id="joinPinBox" style="display:none">
        <div style="font-size:12px;color:#b9c8bc;margin-bottom:5px">Enter Game PIN</div>
        <input id="roomCode" maxlength="6" inputmode="numeric" placeholder="6-digit PIN" autocomplete="off" style="width:150px;text-align:center;text-transform:uppercase;padding:11px;border-radius:10px;border:1px solid #44504a;background:#111712;color:#fff;font-weight:800;letter-spacing:3px">
      </div>
      <div id="roomInfo" style="margin-top:8px;font-size:13px;color:#b9c8bc"></div>
    </div>
    <p>Use <b>WASD</b>, arrow keys, or the controls on mobile.</p>
    <button id="begin" type="button">Enter the Forest</button>
  </div>
</div>

<div id="hud">
  <div class="hudbar">
    <div class="hudbox">
      <div class="title">🌲 BLIND PATH</div>
      <div id="status">Find the opponent</div>
    </div>
    <div class="hudbox"><div id="distance">Opponent: ?</div><div id="visibility" style="font-size:11px;color:#b9c8bc;margin-top:2px">Hidden</div></div>
  </div>
</div>

<div id="goldClue">🪙 GOLD <span id="goldArrow">⬆</span></div>

<button id="shoot" type="button">🎯</button>

<div id="controls">
  <button class="ctrl" id="up" type="button">▲</button>
  <button class="ctrl" id="left" type="button">◀</button>
  <button class="ctrl" id="right" type="button">▶</button>
  <button class="ctrl" id="down" type="button">▼</button>
</div>

<div id="hint">WASD / Arrow Keys · 🕳️ Avoid potholes ·</div>

<!-- Keep your local Three.js file -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/three.min.js"></script>

<script>
(function(){
"use strict";

/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const start = $("start");
const begin = $("begin");
const game = $("game");
const hud = $("hud");
const status = $("status");
const distanceEl = $("distance");
const goldClue = $("goldClue");
const flashBtn = $("flash");
const shootBtn = $("shoot");
const computerModeBtn = $("computerMode");
const createModeBtn = $("createMode");
const joinModeBtn = $("joinMode");
const roomPanel = $("roomPanel");
const createPinBox = $("createPinBox");
const joinPinBox = $("joinPinBox");
const roomPinDisplay = $("roomPinDisplay");
const roomCodeInput = $("roomCode");
const roomInfo = $("roomInfo");

const SUPABASE_URL = "https://daiykupnjfbcsycimxmz.supabase.co";
const SUPABASE_KEY = "sb_publishable_DsXWL1_SIpxoC0yA2MNN1w_70D7pRQI";
let supabaseClient = null;
let networkChannel = null;
let multiplayer = false;
let role = "hunter";
let roomCode = "";
let networkReady = false;
let opponentReady = false;
let lastNetworkSend = 0;
let remoteStateReceived = false;


/* =========================================================
   GAME
========================================================= */

let scene;
let camera;
let renderer;
let clock;
let player;
let flashLight = null;
let started = false;

const keys = {};

const CELL = 2.15;
const COLS = 31;
const ROWS = 45;

let maze = [];
let startCell;
let goalCell;
let goalObject;

let goldObject = null;
let goldCell = null;
let goldCollected = false;
let hider=null, hiderCell=null, hiderTarget=null, hiderMoveTimer=0;
let hiderVisible=false, hiderFound=false, gameOver=false;
let flashActive=false;
let flashUntil=0;
let flashCooldownUntil=0;
let shotCooldownUntil=0;
let shotCount=0;

const FLASH_DURATION=5000;
const FLASH_COOLDOWN=8000;
const NORMAL_VISION=12;
const FLASH_VISION=27;
let potholes=[];
let hazardMessageUntil=0;
const visibility=$("visibility");

let seed = 734921;

function rnd(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

function cx(c){
  return (c - (COLS - 1) / 2) * CELL;
}

function cz(r){
  return (r - (ROWS - 1) / 2) * CELL;
}


/* =========================================================
   GAME MODE / MULTIPLAYER LOBBY
========================================================= */

let selectedMode = "computer";

function setMode(mode){
  selectedMode = mode;
  multiplayer = mode !== "computer";
  [computerModeBtn,createModeBtn,joinModeBtn].forEach(b=>b.classList.remove("active"));
  if(mode === "computer") computerModeBtn.classList.add("active");
  if(mode === "create") createModeBtn.classList.add("active");
  if(mode === "join") joinModeBtn.classList.add("active");

  roomPanel.style.display = mode === "computer" ? "none" : "block";
  createPinBox.style.display = mode === "create" ? "block" : "none";
  joinPinBox.style.display = mode === "join" ? "block" : "none";
  roomInfo.textContent = "";

  if(mode === "create"){
    // The app/server-side game flow generates the PIN; the creator never types it.
    roomCode = makeRoomCode();
    roomPinDisplay.textContent = roomCode;
    begin.textContent = "Create Game & Enter";
  }else if(mode === "join"){
    roomCode = "";
    roomCodeInput.value = "";
    begin.textContent = "Join Game & Enter";
  }else{
    begin.textContent = "Enter the Forest";
  }
}

computerModeBtn.addEventListener("click",()=>setMode("computer"));
createModeBtn.addEventListener("click",()=>setMode("create"));
joinModeBtn.addEventListener("click",()=>setMode("join"));

function makeRoomCode(){
  return String(Math.floor(100000 + Math.random() * 900000));
}

function seedFromRoomCode(code){
  let h=2166136261;
  for(let i=0;i<code.length;i++){
    h ^= code.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return (h>>>0) || 734921;
}

function initRealtime(){
  if(!window.supabase) throw new Error("Supabase library failed to load");
  supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}

async function setupMultiplayer(){
  initRealtime();
  if(!roomCode) throw new Error("Game code is required");

  // The room code deterministically defines the maze seed.
  // Both phones therefore build the exact same maze and exact same spawns.
  seed=seedFromRoomCode(roomCode);

  networkChannel = supabaseClient.channel("blind-path-"+roomCode,{
    config:{broadcast:{self:false},presence:{key:role}}
  });

  networkChannel.on("broadcast",{event:"state"},({payload})=>{
    if(!payload || !hider) return;
    if(payload.role && payload.role===role) return;
    if(Number.isFinite(Number(payload.x))) hider.position.x=Number(payload.x);
    if(Number.isFinite(Number(payload.z))) hider.position.z=Number(payload.z);
    if(Number.isFinite(Number(payload.ry))) hider.rotation.y=Number(payload.ry);
    remoteStateReceived=true;
  });

  networkChannel.on("broadcast",{event:"hit"},({payload})=>{
    if(gameOver) return;
    if(payload && payload.loserRole && payload.loserRole !== role && payload.shooterRole !== role) return;
    hiderFound=true;
    gameOver=true;
    hider.visible=true;
    shootBtn.style.display="none";
    if(payload && payload.shooterRole===role){
      status.textContent="🎯 HIT! You caught the opponent!";
    }else{
      status.textContent="🎯 You were caught!";
    }
    distanceEl.textContent="Opponent caught";
    visibility.textContent="CAUGHT";
    visibility.style.color="#ff6b6b";
  });

  await networkChannel.subscribe(async(statusText)=>{
    if(statusText === "SUBSCRIBED"){
      networkReady=true;
      await networkChannel.track({role});
      roomInfo.textContent = role === "hunter"
        ? "Waiting for Player B to join… Code: "+roomCode
        : "Connected to Player A — you are Player B";
    }
  });
}

/* =========================================================
   START
========================================================= */

begin.addEventListener("click",async function(e){
  e.preventDefault();
  if(started) return;
  if(typeof THREE === "undefined"){ status.textContent="3D engine failed to load"; return; }

  if(selectedMode === "create"){
    // PIN was generated by the app when Create Game was selected.
    if(!roomCode) roomCode = makeRoomCode();
    roomPinDisplay.textContent = roomCode;
    role = "hunter";
  }else if(selectedMode === "join"){
    roomCode = roomCodeInput.value.trim();
    if(!/^\d{6}$/.test(roomCode)){
      roomInfo.textContent="Enter the 6-digit numeric PIN.";
      return;
    }
    role = "hider";
  }else{
    role = "hunter";
  }

  started=true;
  start.classList.add("hidden");
  hud.style.display="block";
  shootBtn.style.display="none";
  status.textContent=multiplayer ? "Connecting to game…" : "Building forest…";

  try{
    if(multiplayer) await setupMultiplayer();
    init();
    if(multiplayer && role === "hunter") {
      status.textContent="Waiting for Player B — Code: "+roomCode;
      roomInfo.textContent="Share this code with Player B: "+roomCode;
    }
  }catch(err){
    console.error(err);
    status.textContent="Multiplayer connection failed";
    roomInfo.textContent=err.message || "Please check the game code and try again.";
  }
});


/* =========================================================
   INIT
========================================================= */

function init(){

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x87b98a);

  scene.fog = new THREE.FogExp2(
  0x87b98a,
  0.006
);


  /* -------------------------------------------------------
     TOP-DOWN 3/4 CAMERA

     Orthographic keeps the reference-game feeling.
     The slight Z offset keeps objects visibly 3D.
  ------------------------------------------------------- */

  const aspect =
    innerWidth / innerHeight;

  const view = 23;

  camera =
    new THREE.OrthographicCamera(
      -view * aspect,
       view * aspect,
       view,
      -view,
      0.1,
      300
    );

  camera.position.set(
    0,
    38,
    13
  );

  camera.lookAt(0,0,0);


  /* -------------------------------------------------------
     RENDERER
  ------------------------------------------------------- */

  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  game.appendChild(
    renderer.domElement
  );


  clock = new THREE.Clock();


  /* -------------------------------------------------------
     LIGHTING
  ------------------------------------------------------- */

  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0x557755,
      1.15
    )
  );


  const moon =
    new THREE.DirectionalLight(
      0xffffff,
      1.2
    );

  moon.position.set(
    -25,
    45,
    18
  );

  moon.castShadow = true;

  moon.shadow.mapSize.width = 2048;
  moon.shadow.mapSize.height = 2048;

  moon.shadow.camera.left = -80;
  moon.shadow.camera.right = 80;
  moon.shadow.camera.top = 100;
  moon.shadow.camera.bottom = -100;

  scene.add(moon);


  createMaze();

  buildWorld();

  createPlayer();
  createHider();

  if(multiplayer){
    // Explicit role-based local/remote spawn. Both devices use the same
    // deterministic maze seed, so these positions are identical on both sides.
    const localCell = role === "hunter" ? startCell : goalCell;
    const remoteCell = role === "hunter" ? goalCell : startCell;
    player.position.set(cx(localCell.c),0,cz(localCell.r));
    hider.position.set(cx(remoteCell.c),0,cz(remoteCell.r));
    hiderTarget=null;
    hiderMoveTimer=999999;
  }

  updateCamera(1);

  status.textContent = multiplayer
    ? (role === "hunter" ? "Waiting for Player B — Code: "+roomCode : "Hide from Player A")
    : "🪙 Find the hidden gold";

  requestAnimationFrame(loop);
}


/* =========================================================
   MAZE
   Starts at bottom CENTER and exits at top CENTER.

   Because this is a perfect maze, every open corridor
   belongs to the same connected maze.
========================================================= */

function createMaze(){

  maze =
    Array.from(
      {length:ROWS},
      () => Array(COLS).fill(1)
    );


  const startR = ROWS - 2;
  const startC = Math.floor(COLS / 2);

  maze[startR][startC] = 0;


  const stack = [{
    r:startR,
    c:startC
  }];


  const directions = [
    [-2,0],
    [2,0],
    [0,-2],
    [0,2]
  ];


  while(stack.length){

    const current =
      stack[stack.length - 1];

    const choices = [];


    for(const d of directions){

      const nr =
        current.r + d[0];

      const nc =
        current.c + d[1];


      if(
        nr > 0 &&
        nr < ROWS - 1 &&
        nc > 0 &&
        nc < COLS - 1 &&
        maze[nr][nc] === 1
      ){

        choices.push({
          nr:nr,
          nc:nc,
          wr:current.r + d[0]/2,
          wc:current.c + d[1]/2
        });

      }

    }


    if(!choices.length){

      stack.pop();
      continue;

    }


    const p =
      choices[
        Math.floor(
          rnd() * choices.length
        )
      ];


    maze[p.wr][p.wc] = 0;
    maze[p.nr][p.nc] = 0;


    stack.push({
      r:p.nr,
      c:p.nc
    });

  }


  startCell = {
    r:ROWS - 2,
    c:startC
  };


  goalCell = {
    r:1,
    c:Math.floor(COLS / 2)
  };


  /* Open a clean entrance and exit */

  maze[ROWS-1][startC] = 0;
  maze[0][goalCell.c] = 0;

}


/* =========================================================
   WORLD GROUND
========================================================= */

function buildGround(){

  const width =
    COLS * CELL + 12;

  const depth =
    ROWS * CELL + 12;


  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width,
        depth
      ),
      new THREE.MeshStandardMaterial({
        color:0x5f8058,
        roughness:1
      })
    );

  ground.rotation.x =
    -Math.PI / 2;

  ground.position.y =
    -0.18;

  ground.receiveShadow = true;

  scene.add(ground);


  /* Large darker outer forest floor */

  const outer =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width + 30,
        depth + 30
      ),
      new THREE.MeshStandardMaterial({
        color:0x41613f,
        roughness:1
      })
    );

  outer.rotation.x =
    -Math.PI / 2;

  outer.position.y =
    -0.25;

  outer.receiveShadow = true;

  scene.add(outer);


  /* Irregular floor patches */

  const patchColors = [
    0x385537,
    0x2d492f,
    0x3d5939,
    0x28432d
  ];


  for(let i=0;i<150;i++){

    const patch =
      new THREE.Mesh(
        new THREE.CircleGeometry(
          0.5 + rnd()*1.8,
          9
        ),
        new THREE.MeshStandardMaterial({
          color:
            patchColors[
              Math.floor(
                rnd()*patchColors.length
              )
            ],
          roughness:1
        })
      );

    patch.rotation.x =
      -Math.PI/2;

    patch.position.set(
      (rnd()-0.5)*COLS*CELL,
      -0.02,
      (rnd()-0.5)*ROWS*CELL
    );

    patch.scale.x =
      0.7 + rnd()*1.8;

    patch.scale.y =
      0.7 + rnd()*1.2;

    scene.add(patch);

  }

}


/* =========================================================
   NATURAL PATH

   No visible square grid.
   Every open maze cell simply becomes part of the
   continuous forest floor.
========================================================= */

function buildPaths(){

  const pathMat =
    new THREE.MeshStandardMaterial({
      color:0x718b63,
      roughness:1
    });

  const dirtMat =
    new THREE.MeshStandardMaterial({
      color:0x806b4c,
      roughness:1
    });


  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      if(maze[r][c] !== 0)
        continue;


      const x = cx(c);
      const z = cz(r);


      /* Full corridor floor */

      const tile =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            CELL + 0.12,
            CELL + 0.12
          ),
          pathMat
        );

      tile.rotation.x =
        -Math.PI/2;

      tile.position.set(
        x,
        0.005,
        z
      );

      tile.receiveShadow = true;

      scene.add(tile);


      /* Natural dirt strip */

      const dirt =
        new THREE.Mesh(
          new THREE.CircleGeometry(
            0.62 + rnd()*0.12,
            10
          ),
          dirtMat
        );

      dirt.rotation.x =
        -Math.PI/2;

      dirt.position.set(
        x + (rnd()-0.5)*0.25,
        0.018,
        z + (rnd()-0.5)*0.25
      );

      dirt.scale.set(
        1.35,
        1.7,
        1
      );

      dirt.receiveShadow = true;

      scene.add(dirt);

    }

  }

}

/* =========================================================
   FOREST WALLS
========================================================= */

function buildForestWalls(){

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      if(maze[r][c] !== 1)
        continue;


      /*
       * Most wall cells receive a tree.
       * A few receive two smaller trees so the walls
       * look organic rather than like a tiled hedge.
       */

      const x = cx(c);
      const z = cz(r);


      if(rnd() < 0.78){

        createTree(
          x + (rnd()-0.5)*0.38,
          z + (rnd()-0.5)*0.38,
          0.82 + rnd()*0.50
        );

      }
      else{

        createTree(
          x - 0.35 + rnd()*0.15,
          z + (rnd()-0.5)*0.3,
          0.62 + rnd()*0.30
        );

        createTree(
          x + 0.35 - rnd()*0.15,
          z + (rnd()-0.5)*0.3,
          0.62 + rnd()*0.30
        );

      }

    }

  }


  /* Outer forest border */

  for(let i=0;i<120;i++){

    const edge =
      Math.floor(rnd()*4);

    let x,z;


    if(edge===0){

      x =
        -COLS*CELL/2 -
        2 +
        rnd()*6;

      z =
        (rnd()-0.5) *
        ROWS*CELL;

    }
    else if(edge===1){

      x =
        COLS*CELL/2 +
        2 -
        rnd()*6;

      z =
        (rnd()-0.5) *
        ROWS*CELL;

    }
    else if(edge===2){

      x =
        (rnd()-0.5) *
        COLS*CELL;

      z =
        -ROWS*CELL/2 -
        2 +
        rnd()*6;

    }
    else{

      x =
        (rnd()-0.5) *
        COLS*CELL;

      z =
        ROWS*CELL/2 +
        2 -
        rnd()*6;

    }


    createTree(
      x,
      z,
      0.72 + rnd()*0.72
    );

  }

}

function createPotholes(){

  potholes=[];

  const candidates=[];

  for(let r=2;r<ROWS-2;r++){
    for(let c=2;c<COLS-2;c++){
      if(maze[r][c]!==0) continue;

      /* Keep important starting/ending areas clear. */
      if(Math.hypot(r-startCell.r,c-startCell.c)<5) continue;
      if(Math.hypot(r-goalCell.r,c-goalCell.c)<5) continue;

      candidates.push({r,c});
    }
  }

  /* Spread the potholes out so they feel like hazards rather than a wall. */
  const chosen=[];
  while(candidates.length && chosen.length<20){
    const i=Math.floor(rnd()*candidates.length);
    const cell=candidates.splice(i,1)[0];
    if(chosen.some(p=>Math.hypot(p.r-cell.r,p.c-cell.c)<4)) continue;
    chosen.push(cell);
  }

  const rimMat=new THREE.MeshStandardMaterial({
    color:0x2a2119,
    roughness:1
  });

  const insideMat=new THREE.MeshStandardMaterial({
    color:0x080706,
    roughness:1
  });

  const wetMat=new THREE.MeshStandardMaterial({
    color:0x151713,
    roughness:.7,
    metalness:.05
  });

  for(const cell of chosen){

    const g=new THREE.Group();
    g.position.set(cx(cell.c),0,cz(cell.r));

    const radius=.43+rnd()*.16;

    /* Raised irregular edge */
    const rim=new THREE.Mesh(
      new THREE.TorusGeometry(radius,.09,8,14),
      rimMat
    );
    rim.rotation.x=-Math.PI/2;
    rim.scale.set(1.15,.82,1);
    rim.position.y=.055;
    rim.castShadow=true;
    rim.receiveShadow=true;
    g.add(rim);

    /* Dark depression */
    const hole=new THREE.Mesh(
      new THREE.CylinderGeometry(radius*.82,radius*.68,.10,14),
      insideMat
    );
    hole.position.y=.01;
    hole.scale.y=.55;
    hole.receiveShadow=true;
    g.add(hole);

    /* A little uneven soil around it */
    const soil=new THREE.Mesh(
      new THREE.CircleGeometry(radius+.18,12),
      wetMat
    );
    soil.rotation.x=-Math.PI/2;
    soil.position.y=.045;
    soil.scale.set(1.15,.82,1);
    soil.rotation.z=rnd()*Math.PI;
    soil.receiveShadow=true;
    g.add(soil);

    scene.add(g);
    potholes.push({
      x:cx(cell.c),
      z:cz(cell.r),
      radius:radius*.72,
      object:g
    });
  }
}

function getPotholeAt(x,z){
  for(const p of potholes){
    if(Math.hypot(x-p.x,z-p.z)<p.radius) return p;
  }
  return null;
}

function getGoldCell(){

  const open=[];

  for(let r=1;r<ROWS-1;r++){
    for(let c=1;c<COLS-1;c++){

      if(maze[r][c] !== 0) continue;

      const ds = [
        Math.hypot(c-startCell.c,r-startCell.r),
        Math.hypot(c-goalCell.c,r-goalCell.r)
      ];

      /* Keep the gold away from both ends so it is genuinely hidden. */
      if(ds[0] < 8 || ds[1] < 8) continue;

      open.push({r,c});
    }
  }

  if(!open.length){
    return {r:Math.floor(ROWS/2),c:Math.floor(COLS/2)};
  }

  /* The existing maze seed makes the gold location repeatable. */
  return open[Math.floor(rnd()*open.length)];
}

function updateGoldClue(){

  if(!goldClue || !player || !goldObject || goldCollected){
    if(goldClue) goldClue.style.display="none";
    return;
  }

  const dx=goldObject.position.x-player.position.x;
  const dz=goldObject.position.z-player.position.z;
  const distance=Math.hypot(dx,dz);

  if(distance < 1.35){
    collectGold();
    return;
  }

  goldClue.style.display="block";

  const arrow=$("goldArrow");
  if(arrow){
    /*
      With the existing top-down camera, +X is screen-right and
      -Z is screen-up. atan2(dx,-dz) therefore points the arrow
      toward the gold on screen.
    */
    const angle=Math.atan2(dx,-dz);
    arrow.style.transform="rotate("+angle+"rad)";
  }

  if(distance < 5){
    goldClue.firstChild.textContent="🪙 Gold is very close ";
  }else{
    goldClue.firstChild.textContent="🪙 Gold is available ";
  }

}

function collectGold(){

  if(goldCollected || !goldObject) return;

  goldCollected=true;
  goldObject.visible=false;

function createHider(){
  hider=new THREE.Group();
  // Multiplayer uses fixed, deterministic spawn cells:
  // Hunter = maze entrance, Hider = maze exit. This guarantees the two
  // devices never start on the same cell and both calculate the same result.
  if(multiplayer){
    hiderCell = {r:goalCell.r,c:goalCell.c};
  }else{
    const candidates=[];
    for(let r=1;r<ROWS-1;r++) for(let c=1;c<COLS-1;c++){

      const ds=Math.hypot(r-startCell.r,c-startCell.c);
      const dg=Math.hypot(r-goalCell.r,c-goalCell.c);
      if(ds>18 && dg>8) candidates.push({r,c});
    }
    hiderCell=candidates.length?candidates[Math.floor(rnd()*candidates.length)]:{r:Math.floor(ROWS/2),c:Math.floor(COLS/2)};
  }

  const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),skin); head.position.y=1.82; head.castShadow=true; hider.add(head);
  const ht=new THREE.Mesh(new THREE.SphereGeometry(.255,14,8),hair); ht.position.y=1.94; ht.scale.y=.55; ht.castShadow=true; hider.add(ht);
  for(const side of[-1,1]){
    const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.48,5,8),shirt); arm.position.set(side*.36,1.07,0); arm.rotation.z=side*.16; arm.castShadow=true; hider.add(arm);
    const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.5,5,8),pants); leg.position.set(side*.12,.45,0); leg.castShadow=true; hider.add(leg);
  }
  const marker=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),new THREE.MeshBasicMaterial({color:0xff5d5d})); marker.position.y=2.18; hider.add(marker);
  hider.visible=false; scene.add(hider); if(!multiplayer || role === "hunter") chooseHiderMove(true);

function cellFromWorld(x,z){return{r:Math.round(z/CELL+(ROWS-1)/2),c:Math.round(x/CELL+(COLS-1)/2)};}

function clearLineOfSight(ax,az,bx,bz,maxDistance=12){

  const dx = bx - ax;
  const dz = bz - az;
  const dist = Math.hypot(dx,dz);

  // Normal vision / Flash range
  if(dist > maxDistance)
    return false;

  const steps = Math.ceil(dist / .18);

  for(let i=1;i<steps;i++){

    const t = i / steps;

    const x = ax + dx * t;
    const z = az + dz * t;

    const p = cellFromWorld(x,z);

    if(
      p.r < 0 ||
      p.r >= ROWS ||
      p.c < 0 ||
      p.c >= COLS ||
      maze[p.r][p.c] === 1
    ){
      return false;
    }
  }

  return true;
}

function updateHiderVisibility(){

  if(!player || !hider || hiderFound) return;

  const now=performance.now();

  if(flashActive && now>=flashUntil){
    flashActive=false;
  }

  const distance=Math.hypot(
    hider.position.x-player.position.x,
    hider.position.z-player.position.z
  );

  const range=flashActive ? FLASH_VISION : NORMAL_VISION;

  const visible=clearLineOfSight(
    player.position.x,
    player.position.z,
    hider.position.x,
    hider.position.z,
    range
  );

  hiderVisible=visible;
  hider.visible=visible;

  const ready=(visible && distance<=16 && canShoot());

  if(ready){
    shootBtn.style.display="block";
    shootBtn.classList.add("ready");
    visibility.textContent=flashActive ? "🎯 AIM READY" : "🎯 SHOOT";
    visibility.style.color="#ff6b6b";
    distanceEl.textContent="Opponent: "+Math.max(1,Math.round(distance/2))+" m";
  }else{
    shootBtn.style.display="none";
    shootBtn.classList.remove("ready");

    if(visible){
      visibility.textContent=flashActive ? "🔦 VISIBLE" : "👁️ VISIBLE";
      visibility.style.color=flashActive ? "#f3d15b" : "#f4d66d";
      distanceEl.textContent="Opponent: "+Math.max(1,Math.round(distance/2))+" m";

      if(now>=hazardMessageUntil){
        status.textContent=multiplayer
          ? (distance<5 ? "⚠️ Opponent nearby!" : "👁️ Opponent visible — get into position")
          : (distance<5 ? "⚠️ Opponent nearby!" : "You can see the opponent — get into position");
      }
    }else{
      visibility.textContent="Hidden";
      visibility.style.color="#b9c8bc";
      distanceEl.textContent="Opponent: ?";
      if(now>=hazardMessageUntil){
        status.textContent=multiplayer
          ? (flashActive ? "🔦 Search for your opponent..." : "Find your opponent")
          : (flashActive ? "🔦 Search the forest..." : "Find the opponent");
      }
    }
  }
}
function chooseHiderMove(initial=false){
  if(!hider||gameOver) return;
  const base=cellFromWorld(hider.position.x,hider.position.z),dirs=[[0,1],[0,-1],[1,0],[-1,0]],options=[];
  for(const d of dirs){const r=base.r+d[0],c=base.c+d[1];if(r>0&&r<ROWS-1&&c>0&&c<COLS-1&&maze[r][c]===0) options.push({r,c});}
  if(!options.length) return;
  const hc=cellFromWorld(player.position.x,player.position.z),seen=clearLineOfSight(player.position.x,player.position.z,hider.position.x,hider.position.z);
  let best=options[Math.floor(rnd()*options.length)];
  if(seen||Math.hypot(hc.r-base.r,hc.c-base.c)<6){
    let bs=-Infinity;
    for(const o of options){const away=Math.hypot(o.r-hc.r,o.c-hc.c),edge=(o.r===1||o.r===ROWS-2||o.c===1||o.c===COLS-2)?-1.2:0,score=away*2.5+edge+rnd()*2.2;if(score>bs){bs=score;best=o;}}
  }
  hiderTarget={x:cx(best.c),z:cz(best.r)}; hiderCell=best; hiderMoveTimer=initial?0:1.1+rnd()*1.4;
}

function updateHider(dt){
  if(!hider||gameOver||hiderFound) return;
  if(multiplayer) return;
  hiderMoveTimer-=dt;
  if(!hiderTarget||hiderMoveTimer<=0) chooseHiderMove();
  if(!hiderTarget) return;
  const dx=hiderTarget.x-hider.position.x,dz=hiderTarget.z-hider.position.z,d=Math.hypot(dx,dz);
  if(d<.08){hider.position.x=hiderTarget.x;hider.position.z=hiderTarget.z;chooseHiderMove();return;}
  const hiderOnPothole=getPotholeAt(hider.position.x,hider.position.z);
  const speed=hiderOnPothole?1.2:2.35;
  hider.position.x+=dx/d*speed*dt; hider.position.z+=dz/d*speed*dt;
  const target=Math.atan2(dx,dz); let diff=target-hider.rotation.y; while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2; hider.rotation.y+=diff*Math.min(1,dt*8);
}

function openCell(x,z){

  const margin = .38;

  const samples = [
    [-margin,-margin],
    [ margin,-margin],
    [-margin, margin],
    [ margin, margin]
  ];


  for(const [sx,sz] of samples){

    const c =
      Math.round(
        (x+sx)/CELL +
        (COLS-1)/2
      );

    const r =
      Math.round(
        (z+sz)/CELL +
        (ROWS-1)/2
      );


    if(
      r < 0 ||
      r >= ROWS ||
      c < 0 ||
      c >= COLS
    ){

      return false;

    }


    if(maze[r][c] !== 0){

      return false;

    }

  }


  return true;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updateCamera(dt){
  if(!camera || !player) return;

  // Keep the camera above the hunter while preserving the 3/4 view.
  const targetX = player.position.x;
  const targetZ = player.position.z;
  const smooth = Math.min(1, dt * 6);

  camera.position.x += (targetX - camera.position.x) * smooth;
  camera.position.z += ((targetZ + 13) - camera.position.z) * smooth;
  camera.position.y = 38;
  camera.lookAt(targetX, 0, targetZ);
}

function updatePlayer(dt){

  if(!player || gameOver)
    return;

  // In multiplayer, movement is allowed as soon as the realtime channel
  // is connected. The round-start signal controls gameplay state, not input.


  let x =
    (keys.d || keys.arrowright ? 1 : 0) -
    (keys.a || keys.arrowleft ? 1 : 0);

  let z =
    (keys.s || keys.arrowdown ? 1 : 0) -
    (keys.w || keys.arrowup ? 1 : 0);


  if(!x && !z)
    return;


  const length =
    Math.hypot(x,z);


  x /= length;
  z /= length;


  const onPothole=getPotholeAt(player.position.x,player.position.z);
  const speed=onPothole ? 1.65 : 4.5;

  if(onPothole){
    hazardMessageUntil=performance.now()+700;
  }

  const nx =
    player.position.x +
    x*speed*dt;

  const nz =
    player.position.z +
    z*speed*dt;


  /* Wall collision */

  if(
    openCell(
      nx,
      player.position.z
    )
  ){

    player.position.x = nx;

  }


  if(
    openCell(
      player.position.x,
      nz
    )
  ){

    player.position.z = nz;

  }


  /* Face movement */

  const target =
    Math.atan2(x,z);

  let diff =
    target -
    player.rotation.y;


  while(diff > Math.PI)
    diff -= Math.PI*2;

  while(diff < -Math.PI)
    diff += Math.PI*2;


  player.rotation.y +=
    diff *
    Math.min(
      1,
      dt*10
    );


  checkGoal();

}


/* =========================================================
   GOAL CHECK
========================================================= */

function checkGoal(){
  if(!player || !goalObject || gameOver) return;
  const d=Math.hypot(player.position.x-goalObject.position.x, player.position.z-goalObject.position.z);
  if(d < 1.4){
    status.textContent="🏁 You reached the exit";
  }
}

/* =========================================================
   FLASH + SHOOT
========================================================= */

function flash(){

  if(!player || gameOver) return;

  // Both multiplayer players have the same equipment.

  const now=performance.now();

  if(now < flashCooldownUntil){
    const remaining=Math.ceil((flashCooldownUntil-now)/1000);
    status.textContent="🔦 Flash recharging... "+remaining+"s";
    return;
  }

  flashActive=true;
  flashUntil=now+FLASH_DURATION;
  flashCooldownUntil=now+FLASH_COOLDOWN;

  if(flashLight) scene.remove(flashLight);

  flashLight=new THREE.PointLight(0xfff2c2,42,26,2);
  flashLight.position.set(player.position.x,4,player.position.z);
  scene.add(flashLight);

  status.textContent="🔦 Flash active — search for the opponent";

  setTimeout(function(){
    if(flashLight){
      scene.remove(flashLight);
      flashLight=null;
    }
  },FLASH_DURATION);
}

function canShoot(){

  if(!player || !hider || hiderFound || gameOver) return false;

  const now=performance.now();
  if(now < shotCooldownUntil) return false;

  const dx=hider.position.x-player.position.x;
  const dz=hider.position.z-player.position.z;
  const distance=Math.hypot(dx,dz);

  /* The opponent must be close enough to make a meaningful shot. */
  if(distance>16) return false;

  /* The opponent must be visible through the maze. */
  if(!clearLineOfSight(
    player.position.x,
    player.position.z,
    hider.position.x,
    hider.position.z,
    16
  )) return false;

  /* Require the player to be facing the opponent. */
  const playerAngle=player.rotation.y;
  const targetAngle=Math.atan2(dx,dz);

  let diff=targetAngle-playerAngle;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;

  return Math.abs(diff)<0.42;
}

function shoot(){

  if(!player || gameOver) return;
  if(multiplayer && !networkReady) return;

  const now=performance.now();

  if(now < shotCooldownUntil){
    const remaining=Math.ceil((shotCooldownUntil-now)/1000);
    status.textContent="🎯 Shot reloading... "+remaining+"s";
    return;
  }

  if(!canShoot()){
    status.textContent="🎯 No clear shot — face the opponent";
    shotCooldownUntil=now+900;
    return;
  }

  shotCount++;

  hiderFound=true;
  gameOver=true;
  hider.visible=true;
  if(multiplayer && networkChannel) networkChannel.send({
    type:"broadcast",
    event:"hit",
    payload:{shooterRole:role,loserRole:(role === "hunter" ? "hider" : "hunter"),timestamp:Date.now()}
  });

  status.textContent="🎯 HIT! You caught the opponent!";
  distanceEl.textContent="Opponent caught";
  visibility.textContent="CAUGHT";
  visibility.style.color="#ff6b6b";

  shootBtn.classList.remove("ready");
  shootBtn.style.display="none";

  /* Small hit flash */
  const hitLight=new THREE.PointLight(0xff4444,28,10,2);
  hitLight.position.set(hider.position.x,2,hider.position.z);
  scene.add(hitLight);

  setTimeout(function(){
    scene.remove(hitLight);
  },450);
}

flashBtn.addEventListener("click",function(e){
  e.preventDefault();
  flash();
});

shootBtn.addEventListener("click",function(e){
  e.preventDefault();
  shoot();
});


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    const key =
      e.key.toLowerCase();

    keys[key] = true;


    if([
      "arrowup",
      "arrowdown",
      "arrowleft",
      "arrowright",
      " "
    ].includes(key)){

      e.preventDefault();

    }

  }
);


window.addEventListener(
  "keyup",
  function(e){

    keys[
      e.key.toLowerCase()
    ] = false;

  }
);


/* =========================================================
   MOBILE BUTTONS
========================================================= */

function bindControl(id,key){

  const button =
    $(id);


  function down(e){

    e.preventDefault();

    keys[key] = true;

  }


  function up(e){

    e.preventDefault();

    keys[key] = false;

  }


  button.addEventListener(
    "pointerdown",
    down
  );

  button.addEventListener(
    "pointerup",
    up
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );

}


bindControl("up","arrowup");
bindControl("down","arrowdown");
bindControl("left","arrowleft");
bindControl("right","arrowright");


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  function(){

    if(!camera || !renderer)
      return;


    const aspect =
      innerWidth / innerHeight;

    const view = 23;


    camera.left =
      -view*aspect;

    camera.right =
      view*aspect;

    camera.top =
      view;

    camera.bottom =
      -view;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

  requestAnimationFrame(loop);


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  updatePlayer(dt);
  updateHider(dt);
  updateHiderVisibility();
  updateGoldClue();

  updateCamera(dt);


  if(
    flashLight &&
    player
  ){

    flashLight.position.set(
      player.position.x,
      3,
      player.position.z
    );

  }

  if(multiplayer && networkChannel && player && performance.now()-lastNetworkSend>50){
    lastNetworkSend=performance.now();
    networkChannel.send({type:"broadcast",event:"state",payload:{role:role,x:player.position.x,z:player.position.z,ry:player.rotation.y}});
  }

  renderer.render(
    scene,
    camera
  );

}


})();
</script>
