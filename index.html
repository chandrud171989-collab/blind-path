<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blind Path 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050806;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#start{
 position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(#071009cc,#020403ee);padding:20px
}
.card{
 width:min(430px,94vw);padding:28px 22px;border:1px solid #49634d;border-radius:22px;
 background:#101812;box-shadow:0 20px 70px #000c;text-align:center
}
h1{margin:0 0 8px;font-size:32px}
p{color:#b8c5ba;line-height:1.5}
button{
 border:0;border-radius:14px;padding:15px 24px;font-size:17px;font-weight:800;
 cursor:pointer;touch-action:manipulation
}
#begin{background:#62d68a;color:#07100a;width:100%;margin-top:12px}
#flash{
 position:fixed;right:18px;bottom:22px;z-index:15;display:none;
 background:#f4d35e;color:#16120a;box-shadow:0 8px 25px #0008
}
#hud{
 position:fixed;top:14px;left:14px;right:14px;z-index:10;display:none;
 pointer-events:none
}
.pill{display:inline-block;background:#071009bb;border:1px solid #405444;border-radius:12px;padding:8px 11px}
#status{font-size:13px;color:#dce7dd}
#hint{
 position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
 z-index:10;color:#d5e0d6;background:#071009aa;padding:8px 12px;border-radius:10px;
 font-size:12px;pointer-events:none;display:none;white-space:nowrap
}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>

<div id="start">
 <div class="card">
  <h1>🌲 Blind Path</h1>
  <p>Enter the forest and find your way through the darkness.</p>
  <p>Use <b>WASD</b> or the arrow keys to move. On desktop, move the mouse to look around.</p>
  <button id="begin" type="button">Enter the Forest</button>
 </div>
</div>

<div id="hud"><span class="pill" id="status">Loading 3D forest…</span></div>
<button id="flash" type="button">🔦 Flash</button>
<div id="hint">WASD / Arrow Keys · Mouse to look</div>

<script>
(function(){
"use strict";

const start=document.getElementById("start");
const begin=document.getElementById("begin");
const game=document.getElementById("game");
const flashButton=document.getElementById("flash");
const hud=document.getElementById("hud");
const status=document.getElementById("status");
const hint=document.getElementById("hint");

let started=false;
let scene,camera,renderer,clock;
let yaw=0,pitch=0;
const keys={};

begin.addEventListener("click", function(e){
 e.preventDefault();
 e.stopPropagation();
 started=true;
 start.classList.add("hidden");
 hud.style.display="block";
 flashButton.style.display="block";
 hint.style.display="block";

 if(typeof THREE==="undefined"){
   status.textContent="Loading 3D engine…";
   return;
 }
 status.textContent="Starting forest…";
 init();
}, {passive:false});

begin.addEventListener("touchend", function(e){
 e.preventDefault();
 if(!started) begin.click();
}, {passive:false});

function init(){
 if(renderer) return;
 if(typeof THREE==="undefined"){
   status.textContent="3D engine is still loading…";
   return;
 }

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x020504);
 scene.fog=new THREE.FogExp2(0x07100a,0.055);

 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,150);
 camera.position.set(0,1.65,8);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 game.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 const hemi=new THREE.HemisphereLight(0x78927a,0x101510,1.0);
 scene.add(hemi);

 const moon=new THREE.DirectionalLight(0xb7c7ff,1.3);
 moon.position.set(-20,30,10);
 moon.castShadow=true;
 scene.add(moon);

 makeGround();
 makeForest();

 status.textContent="Find the path";
 requestAnimationFrame(loop);
}

function makeGround(){
 const geo=new THREE.PlaneGeometry(150,150);
 const mat=new THREE.MeshStandardMaterial({color:0x111a12,roughness:1});
 const ground=new THREE.Mesh(geo,mat);
 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;
 scene.add(ground);

 const pathMat=new THREE.MeshStandardMaterial({color:0x473c2d,roughness:1});
 for(let i=0;i<24;i++){
   const z=6-i*4;
   const x=Math.sin(i*0.75)*3.5;
   const path=new THREE.Mesh(new THREE.PlaneGeometry(2.7,5),pathMat);
   path.rotation.x=-Math.PI/2;
   path.position.set(x,0.012,z);
   path.rotation.z=Math.sin(i*.8)*.12;
   scene.add(path);
 }
}

function makeTree(x,z,s){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 g.scale.setScalar(s);

 const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.22,.34,3.2,8),
   new THREE.MeshStandardMaterial({color:0x39281b,roughness:1})
 );
 trunk.position.y=1.6;
 trunk.castShadow=true;
 g.add(trunk);

 for(let i=0;i<4;i++){
   const crown=new THREE.Mesh(
     new THREE.ConeGeometry(1.8-i*.28,2.5,8),
     new THREE.MeshStandardMaterial({color:0x17351d,roughness:1})
   );
   crown.position.y=3.0+i*.75;
   crown.castShadow=true;
   g.add(crown);
 }
 scene.add(g);
}

function makeForest(){
 for(let i=0;i<85;i++){
   const side=Math.random()<.5?-1:1;
   const x=side*(5+Math.random()*25);
   const z=12-Math.random()*105;
   makeTree(x,z,.75+Math.random()*1.2);
 }
}

function doFlash(){
 if(!started || !scene) return;
 const light=new THREE.PointLight(0xfff5cf,18,24,2);
 light.position.copy(camera.position);
 light.position.y+=.05;
 scene.add(light);
 setTimeout(()=>scene.remove(light),900);
}

flashButton.addEventListener("click",function(e){
 e.preventDefault();
 doFlash();
},{passive:false});

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))
   e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

window.addEventListener("mousemove",e=>{
 if(!started) return;
 if(document.pointerLockElement===renderer?.domElement || e.buttons){
   yaw-=e.movementX*.002;
   pitch-=e.movementY*.002;
   pitch=Math.max(-1.2,Math.min(1.2,pitch));
 }
});

window.addEventListener("resize",()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05);

 const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);

 const speed=forward||side?3.2:0;
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 const dir=new THREE.Vector3();
 camera.getWorldDirection(dir);
 dir.y=0;dir.normalize();

 const right=new THREE.Vector3(dir.z,0,-dir.x);
 camera.position.addScaledVector(dir,forward*speed*dt);
 camera.position.addScaledVector(right,side*speed*dt);
 camera.position.y=1.65;

 renderer.render(scene,camera);
}

const three=document.createElement("script");
three.src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js";
three.onload=function(){
 status.textContent="3D engine ready";
 if(started && !renderer){
   status.textContent="Starting forest…";
   init();
 } else if(!started){
   status.textContent="Ready — press Enter the Forest";
 }
};
three.onerror=function(){
 status.textContent="Unable to load 3D engine. Check internet connection.";
};
document.head.appendChild(three);

})();
</script>
</body>
</html>
